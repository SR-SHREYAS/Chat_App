<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Chat App</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue to your chat dashboard.</p>

      <form id="signinForm" class="auth-form">
        <label for="signinEmail">Email</label>
        <input id="signinEmail" name="email" type="email" autocomplete="email" required />

        <label for="signinPassword">Password</label>
        <input id="signinPassword" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Sign In</button>

        <div class="auth-footer-link">
          <a href="/signup">Sign Up</a>
        </div>
      </form>

      <div id="authMessage" class="auth-message" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/js/signin.js"></script>
</body>
</html>
