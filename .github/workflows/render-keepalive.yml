name: Render Keepalive Ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "KEEPALIVE_URL secret is not set."
            exit 1
          fi

          curl --fail --silent --show-error --location --max-time 20 "$KEEPALIVE_URL" > /dev/null
          echo "Ping successful: $KEEPALIVE_URL"
